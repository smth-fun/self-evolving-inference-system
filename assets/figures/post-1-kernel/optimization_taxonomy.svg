<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 15px; fill: #1e293b; font-weight: 600; }
      .subtitle { font-size: 11px; fill: #64748b; }
      .bar-label { font-size: 13px; fill: white; font-weight: 600; }
      .bar-detail { font-size: 10.5px; fill: white; opacity: 0.9; }
      .section-title { font-size: 12px; fill: #1e293b; font-weight: 600; }
      .gauge-label { font-size: 10.5px; fill: #475569; }
      .gauge-value { font-size: 12px; fill: #1e293b; font-weight: 700; }
      .gauge-pct { font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="425" fill="#fafbfc" rx="8"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">What the 95% Improvement Was Made Of</text>
  <text x="400" y="48" text-anchor="middle" class="subtitle">512 → 999 tok/s decomposed by optimization category</text>

  <!-- Main contribution bar: full width = 680px (x=60..740) -->
  <!-- Weight Quantization: 58% = 394px -->
  <rect x="60" y="70" width="394" height="60" rx="6" fill="#1e40af"/>
  <text x="257" y="97" text-anchor="middle" class="bar-label">Weight Quantization</text>
  <text x="257" y="115" text-anchor="middle" class="bar-detail">58% of gains (+284 tok/s)</text>

  <!-- Kernel Fusion: 29% = 197px -->
  <rect x="454" y="70" width="197" height="60" fill="#0d9488"/>
  <text x="552" y="97" text-anchor="middle" class="bar-label">Kernel Fusion</text>
  <text x="552" y="115" text-anchor="middle" class="bar-detail">29% (+143 tok/s)</text>

  <!-- Execution Optimization: 12% = 82px (ends at 740) -->
  <rect x="651" y="70" width="89" height="60" rx="6" fill="#ea580c"/>
  <rect x="651" y="70" width="20" height="60" fill="#ea580c"/>
  <text x="695" y="97" text-anchor="middle" class="bar-label" font-size="10.5">Exec Opt</text>
  <text x="695" y="115" text-anchor="middle" class="bar-detail" font-size="9">12% (+60 tok/s)</text>

  <!-- Round left corner of first bar -->
  <rect x="60" y="70" width="20" height="60" rx="6" fill="#1e40af"/>

  <!-- Divider -->
  <line x1="60" y1="160" x2="740" y2="160" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Section: Success Rate by Category -->
  <text x="400" y="185" text-anchor="middle" class="section-title">Success Rate by Optimization Category (40+ attempts total)</text>

  <!-- Gauge 1: Kernel Fusion 7/12 = 58% -->
  <g transform="translate(100, 210)">
    <rect x="0" y="18" width="160" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="0" y="18" width="93" height="12" rx="6" fill="#0d9488"/>
    <text x="0" y="12" class="gauge-label">Kernel Fusion</text>
    <text x="164" y="28" class="gauge-value" text-anchor="start">7/12</text>
    <text x="195" y="28" class="gauge-pct" text-anchor="start">58%</text>
  </g>

  <!-- Gauge 2: Weight Quantization 3/6 = 50% -->
  <g transform="translate(100, 255)">
    <rect x="0" y="18" width="160" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="0" y="18" width="80" height="12" rx="6" fill="#1e40af"/>
    <text x="0" y="12" class="gauge-label">Weight Quantization</text>
    <text x="164" y="28" class="gauge-value" text-anchor="start">3/6</text>
    <text x="191" y="28" class="gauge-pct" text-anchor="start">50%</text>
  </g>

  <!-- Gauge 3: Parameter Tuning 2/10 = 20% -->
  <g transform="translate(430, 210)">
    <rect x="0" y="18" width="160" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="0" y="18" width="32" height="12" rx="6" fill="#f59e0b"/>
    <text x="0" y="12" class="gauge-label">Parameter Tuning</text>
    <text x="164" y="28" class="gauge-value" text-anchor="start">2/10</text>
    <text x="198" y="28" class="gauge-pct" text-anchor="start">20%</text>
  </g>

  <!-- Gauge 4: CPU/Scheduling 0/7 = 0% -->
  <g transform="translate(430, 255)">
    <rect x="0" y="18" width="160" height="12" rx="6" fill="#e2e8f0"/>
    <text x="0" y="12" class="gauge-label">CPU / Scheduling</text>
    <text x="164" y="28" class="gauge-value" text-anchor="start">0/7</text>
    <text x="191" y="28" class="gauge-pct" text-anchor="start" fill="#ef4444">0%</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="310" x2="740" y2="310" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bottom insight box -->
  <rect x="60" y="325" width="680" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <text x="80" y="350" font-size="12" fill="#1e293b" font-weight="600">Key takeaway:</text>
  <text x="80" y="370" font-size="11" fill="#475569">For memory-bandwidth-bound inference, reducing the data you move (quantization)</text>
  <text x="80" y="387" font-size="11" fill="#475569">matters far more than how efficiently you move it (kernel tuning). Quantization</text>
  <text x="80" y="404" font-size="11" fill="#475569">accounted for 58% of all gains despite only 6 attempts — kernel fusion took 12.</text>
</svg>