<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 385" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .subtitle { font-size: 11.5px; fill: #64748b; }
      .label { font-size: 11px; fill: #1e293b; font-weight: 600; }
      .detail { font-size: 10px; fill: #475569; }
      .small { font-size: 9px; fill: #94a3b8; }
      .code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10px; fill: #475569; }
      .phase-label { font-size: 12px; fill: #1e293b; font-weight: 700; }
    </style>
  </defs>

  <rect width="820" height="385" fill="#fafbfc" rx="8"/>

  <!-- Subtitle only -->
  <text x="410" y="28" text-anchor="middle" class="subtitle">Why computing the same norm 2,048 times is faster than computing it once</text>

  <!-- LEFT: Standard Approach -->
  <text x="205" y="58" text-anchor="middle" class="phase-label" fill="#dc2626">Standard Approach (Two-Phase)</text>

  <rect x="55" y="72" width="300" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="70" y="91" class="label">Kernel 1: RMSNorm</text>
  <text x="70" y="107" class="detail">Compute norm of input x (1024 elements)</text>
  <text x="330" y="102" text-anchor="end" class="small">~1 μs compute</text>

  <!-- Downward arrow: simple triangle + line, no marker -->
  <line x1="205" y1="122" x2="205" y2="145" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="199,143 211,143 205,152" fill="#ef4444"/>
  <text x="270" y="140" class="detail" fill="#ef4444">write norm to GMEM</text>

  <rect x="130" y="155" width="150" height="30" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="205" y="175" text-anchor="middle" class="code" fill="#dc2626">Global Memory: norm_val</text>

  <!-- Downward arrow -->
  <line x1="205" y1="185" x2="205" y2="208" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="199,206 211,206 205,215" fill="#ef4444"/>
  <text x="280" y="203" class="detail" fill="#ef4444">kernel launch ~5 μs</text>

  <rect x="55" y="218" width="300" height="80" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="70" y="238" class="label">Kernel 2: GEMV (2,048 blocks)</text>
  <g transform="translate(70, 248)">
    <rect x="0" y="0" width="40" height="22" rx="3" fill="#fecaca"/>
    <text x="20" y="15" text-anchor="middle" class="small" fill="#dc2626">Blk 0</text>
    <rect x="46" y="0" width="40" height="22" rx="3" fill="#fecaca"/>
    <text x="66" y="15" text-anchor="middle" class="small" fill="#dc2626">Blk 1</text>
    <rect x="92" y="0" width="40" height="22" rx="3" fill="#fecaca"/>
    <text x="112" y="15" text-anchor="middle" class="small" fill="#dc2626">Blk 2</text>
    <text x="146" y="15" class="detail" fill="#dc2626">…</text>
    <rect x="162" y="0" width="55" height="22" rx="3" fill="#fecaca"/>
    <text x="189" y="15" text-anchor="middle" class="small" fill="#dc2626">Blk 2047</text>
  </g>
  <text x="70" y="288" class="detail">Each reads norm_val from global memory</text>

  <rect x="80" y="310" width="250" height="36" rx="6" fill="#fff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="205" y="325" text-anchor="middle" class="label" fill="#dc2626">Total: ~1 + 5 + 5 = ~11 μs overhead</text>
  <text x="205" y="339" text-anchor="middle" class="detail" fill="#dc2626">norm compute + launch + GMEM round-trips</text>

  <!-- Divider -->
  <line x1="410" y1="50" x2="410" y2="355" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="410" y="372" text-anchor="middle" font-size="13" fill="#64748b" font-weight="600">vs</text>

  <!-- RIGHT: Agent's Approach -->
  <text x="615" y="58" text-anchor="middle" class="phase-label" fill="#16a34a">Agent's Approach (Fused, Redundant)</text>

  <rect x="465" y="72" width="300" height="230" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="480" y="92" class="label">Single Fused Kernel (2,048 blocks)</text>

  <g transform="translate(480, 107)">
    <rect x="0" y="0" width="120" height="75" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="60" y="16" text-anchor="middle" class="label" fill="#16a34a">Block 0</text>
    <text x="8" y="32" class="code" fill="#16a34a">1. load x[0:1024]</text>
    <text x="8" y="44" class="code" fill="#16a34a">2. compute norm</text>
    <text x="8" y="56" class="code" fill="#16a34a">3. GEMV row 0</text>
    <text x="8" y="70" class="small" fill="#16a34a">~2 μs for norm</text>

    <rect x="135" y="0" width="120" height="75" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="195" y="16" text-anchor="middle" class="label" fill="#16a34a">Block 1</text>
    <text x="143" y="32" class="code" fill="#16a34a">1. load x[0:1024]</text>
    <text x="143" y="44" class="code" fill="#16a34a">2. compute norm</text>
    <text x="143" y="56" class="code" fill="#16a34a">3. GEMV row 1</text>
    <text x="143" y="70" class="small" fill="#16a34a">~2 μs for norm</text>

    <rect x="0" y="85" width="120" height="75" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="60" y="101" text-anchor="middle" class="label" fill="#16a34a">Block 2</text>
    <text x="8" y="117" class="code" fill="#16a34a">1. load x[0:1024]</text>
    <text x="8" y="129" class="code" fill="#16a34a">2. compute norm</text>
    <text x="8" y="141" class="code" fill="#16a34a">3. GEMV row 2</text>
    <text x="8" y="155" class="small" fill="#16a34a">~2 μs for norm</text>

    <rect x="135" y="85" width="120" height="75" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="195" y="121" text-anchor="middle" class="label" fill="#16a34a">… Block 2047</text>
    <text x="143" y="141" class="code" fill="#16a34a">same pattern</text>
  </g>

  <rect x="480" y="275" width="270" height="22" rx="4" fill="#bbf7d0"/>
  <text x="615" y="290" text-anchor="middle" class="detail" fill="#166534">x (4 KB) stays warm in L2 cache — reload is ~free</text>

  <rect x="490" y="310" width="250" height="36" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.2"/>
  <text x="615" y="325" text-anchor="middle" class="label" fill="#16a34a">Total: ~2 μs (norm hidden in compute)</text>
  <text x="615" y="339" text-anchor="middle" class="detail" fill="#166534">No launch gap, no GMEM sync, norm from L2</text>
</svg>